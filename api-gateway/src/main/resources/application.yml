server:
  port: 9090

spring:
  application:
    name: api-gateway
  security:
    user:
      name: admin
      password: admin123
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-service
              uri: ${PRODUCT_SERVICE_URI:http://localhost:8080}
              predicates:
                - Path=/api/products/**,/api/categories/**

            - id: customer-service
              uri: ${CUSTOMER_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/customers/**

            - id: order-service
              uri: ${ORDER_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/orders/**
